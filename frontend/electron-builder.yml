appId: app.korero.voice
productName: Korero.chat
artifactName: ${productName}-${os}-${arch}.${ext}
npmRebuild: false
directories:
  output: desktop-dist
files:
  - dist/**/*
  - electron/**/*
  - "!node_modules/!(ws|x11|electron-updater|builder-util-runtime|fs-extra|graceful-fs|jsonfile|universalify|js-yaml|argparse|lazy-val|lodash.escaperegexp|lodash.isequal|semver|tiny-typed-emitter|debug|ms|sax){,/**/*}"
publish:
  provider: github
  owner: WardPearce
  repo: korero
toolsets:
  appimage: "1.0.3"
linux:
  icon: static/icon.png
  syncDesktopName: true
  target:
    - deb
    - zip
    - rpm
    - AppImage
    - snap
  category: "GNOME;GTK;AudioVideo;Network;Utility;"
win:
  icon: static/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: 7z
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
nsis:
  allowElevation: true
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: static/icon.png
  extendInfo:
    NSMicrophoneUsageDescription: Korero.chat uses the microphone for voice channels.
  target:
    - target: default
      arch: universal
rpm:
  fpm: ["--rpm-rpmbuild-define=_build_id_links none"]
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
