services:
  voice-server:
    image: voice-server:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8443:8443/tcp"
      - "8444:8444/udp"
      - "8444:8444/tcp"
    volumes:
      - voice-data:/data
    environment:
      VOICE_DATA_DIR: /data
      VOICE_MEDIA_ANNOUNCED_ADDRESS: ${VOICE_MEDIA_ANNOUNCED_ADDRESS:-}
      VOICE_MEDIA_ANNOUNCED_IPV6: ${VOICE_MEDIA_ANNOUNCED_IPV6:-}
volumes:
  voice-data:
