name: Release landing image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: wardpearce/korero-landig

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: landing
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.DOCKERHUB_IMAGE }}:${{ github.ref_name }}-${{ matrix.architecture }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-architecture tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create \
            --tag "$DOCKERHUB_IMAGE:$TAG" \
            --tag "$DOCKERHUB_IMAGE:latest" \
            "$DOCKERHUB_IMAGE:$TAG-amd64" \
            "$DOCKERHUB_IMAGE:$TAG-arm64"
