name: Build desktop release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake git libgtk-3-dev libayatana-appindicator3-dev \
            libfuse2 libssl-dev librsvg2-dev ninja-build patchelf pkg-config rpm

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build web client and native media library
        run: |
          bun run build
          bun run prepare:media
          cargo build --locked --release --manifest-path native/Cargo.toml --features desktop --bin desktop-client

      - name: Package Linux desktop builds
        run: bunx electron-builder --linux deb zip rpm AppImage --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          path: |
            frontend/desktop-dist/*.deb
            frontend/desktop-dist/*.zip
            frontend/desktop-dist/*.rpm
            frontend/desktop-dist/*.AppImage
          if-no-files-found: error
