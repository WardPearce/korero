name: Build desktop release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            os: ubuntu-24.04
          - runtime: osx-arm64
            os: macos-latest
          - runtime: win-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfuse2 patchelf rpm

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          if [[ "$RELEASE_TAG" != v* || ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be v followed by a semantic version (for example v1.2.3 or v1.2.3-beta.1)"
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build web client
        run: bun run build

      - name: Package Linux desktop builds
        if: runner.os == 'Linux'
        run: bunx electron-builder --linux deb zip rpm AppImage --x64 --publish never -c.extraMetadata.version="$RELEASE_VERSION"

      - name: Package macOS desktop builds
        if: runner.os == 'macOS'
        run: bunx electron-builder --mac dmg zip --arm64 --publish never -c.extraMetadata.version="$RELEASE_VERSION"

      - name: Package Windows desktop builds
        if: runner.os == 'Windows'
        run: bunx electron-builder --win nsis 7z zip --x64 --publish never -c.extraMetadata.version="$RELEASE_VERSION"

      - name: Verify desktop packages
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) formats=(deb rpm AppImage zip) ;;
            macOS) formats=(dmg zip) ;;
            Windows) formats=(exe 7z zip) ;;
          esac
          for format in "${formats[@]}"; do
            if ! compgen -G "desktop-dist/*.$format" > /dev/null; then
              echo "::error::Missing desktop package: *.$format"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.runtime }}
          path: |
            frontend/desktop-dist/*.deb
            frontend/desktop-dist/*.rpm
            frontend/desktop-dist/*.AppImage
            frontend/desktop-dist/*.zip
            frontend/desktop-dist/*.dmg
            frontend/desktop-dist/*.exe
            frontend/desktop-dist/*.7z
            frontend/desktop-dist/*.yml
            !frontend/desktop-dist/builder-debug.yml
            frontend/desktop-dist/*.blockmap
          if-no-files-found: error
