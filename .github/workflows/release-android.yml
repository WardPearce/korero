name: Build Android release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Install frontend dependencies and sync Android project
        run: |
          bun install --frozen-lockfile
          bun run mobile:sync

      - name: Build release APK and app bundle
        working-directory: frontend/android
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: |
          version=${RELEASE_VERSION#v}
          ./gradlew --no-daemon \
            -PreleaseVersionCode="$RELEASE_VERSION_CODE" \
            -PreleaseVersionName="$version" \
            assembleRelease bundleRelease

      - name: Sign Android artifacts
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signing_dir=$(mktemp -d)
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"
          chmod 600 "$signing_dir/release.jks"
          export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          mkdir -p app/release

          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*-unsigned.apk)
          bundles=(app/build/outputs/bundle/release/*.aab)
          (( ${#apks[@]} > 0 && ${#bundles[@]} > 0 ))

          for apk in "${apks[@]}"; do
            name=$(basename "${apk%-unsigned.apk}")
            "$build_tools/zipalign" -f -P 16 4 "$apk" "$signing_dir/aligned.apk"
            "$build_tools/apksigner" sign \
              --ks "$signing_dir/release.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "app/release/$name.apk" \
              "$signing_dir/aligned.apk"
            "$build_tools/apksigner" verify "app/release/$name.apk"
          done

          for bundle in "${bundles[@]}"; do
            name=$(basename "${bundle%.aab}")
            jarsigner -keystore "$signing_dir/release.jks" \
              -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -keypass:env ANDROID_KEY_PASSWORD \
              -signedjar "app/release/$name.aab" \
              "$bundle" "$ANDROID_KEY_ALIAS"
            jarsigner -verify "app/release/$name.aab"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: frontend/android/app/release/*
          if-no-files-found: error
