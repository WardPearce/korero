name: Build server binaries

on:
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: node:24-trixie
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates libssl-dev meson ninja-build pkg-config

      - name: Install server dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Bundle standalone server
        run: bun run build "dist/voice-server-linux-${{ matrix.architecture }}"

      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-${{ matrix.architecture }}
          path: backend/dist/voice-server-linux-${{ matrix.architecture }}
          if-no-files-found: error
