name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    uses: ./.github/workflows/release-android.yml
    secrets: inherit

  desktop:
    uses: ./.github/workflows/release-desktop.yml

  server:
    uses: ./.github/workflows/release-server.yml

  docker-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_REPOSITORY || 'wardpearce/korero-server' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.DOCKERHUB_IMAGE }}:${{ github.ref_name }}-${{ matrix.architecture }}

  docker:
    needs: docker-build
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_REPOSITORY || 'wardpearce/korero-server' }}
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-architecture tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create \
            --tag "$DOCKERHUB_IMAGE:$TAG" \
            --tag "$DOCKERHUB_IMAGE:latest" \
            "$DOCKERHUB_IMAGE:$TAG-amd64" \
            "$DOCKERHUB_IMAGE:$TAG-arm64"

  publish:
    needs: [android, desktop, server, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums for server binaries
        working-directory: release-assets
        run: sha256sum voice-server-linux-amd64 voice-server-linux-arm64 > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes --draft
          fi
          mapfile -d '' assets < <(find release-assets -type f -print0)
          (( ${#assets[@]} > 0 ))
          duplicates=$(printf '%s\n' "${assets[@]##*/}" | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate release asset names: $duplicates"
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
