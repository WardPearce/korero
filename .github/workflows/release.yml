name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    uses: ./.github/workflows/release-android.yml
    secrets: inherit

  desktop:
    uses: ./.github/workflows/release-desktop.yml

  server:
    uses: ./.github/workflows/release-server.yml

  docker-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_REPOSITORY || 'wardpearce/korero-server' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.DOCKERHUB_IMAGE }}:${{ github.ref_name }}-${{ matrix.architecture }}

  docker:
    needs: docker-build
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_REPOSITORY || 'wardpearce/korero-server' }}
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-architecture tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create \
            --tag "$DOCKERHUB_IMAGE:$TAG" \
            --tag "$DOCKERHUB_IMAGE:latest" \
            "$DOCKERHUB_IMAGE:$TAG-amd64" \
            "$DOCKERHUB_IMAGE:$TAG-arm64"

  publish:
    needs: [android, desktop, server, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: "{android,desktop-linux-x64,desktop-osx-arm64,desktop-win-x64,server-linux-amd64,server-linux-arm64}"
          path: release-assets

      - name: Validate release assets
        run: |
          set -euo pipefail
          for artifact in android desktop-linux-x64 desktop-osx-arm64 desktop-win-x64 server-linux-amd64 server-linux-arm64; do
            if [ ! -d "release-assets/$artifact" ] || [ -z "$(find "release-assets/$artifact" -type f -print -quit)" ]; then
              echo "::error::Missing or empty release artifact: $artifact"
              exit 1
            fi
          done
          while IFS= read -r -d '' asset; do
            case "$asset" in
              release-assets/android/*.apk|release-assets/android/*.aab|\
              release-assets/desktop-linux-x64/*.deb|release-assets/desktop-linux-x64/*.rpm|release-assets/desktop-linux-x64/*.AppImage|release-assets/desktop-linux-x64/*.zip|release-assets/desktop-linux-x64/*.blockmap|release-assets/desktop-linux-x64/*.yml|\
              release-assets/desktop-osx-arm64/*.dmg|release-assets/desktop-osx-arm64/*.zip|release-assets/desktop-osx-arm64/*.blockmap|release-assets/desktop-osx-arm64/*.yml|\
              release-assets/desktop-win-x64/*.exe|release-assets/desktop-win-x64/*.7z|release-assets/desktop-win-x64/*.zip|release-assets/desktop-win-x64/*.blockmap|release-assets/desktop-win-x64/*.yml|\
              release-assets/server-linux-amd64/voice-server-linux-amd64|release-assets/server-linux-arm64/voice-server-linux-arm64) ;;
              *) echo "::error::Unexpected release asset: $asset"; exit 1 ;;
            esac
            relative=${asset#release-assets/}
            relative=${relative#*/}
            if [[ "$relative" == */* ]]; then
              echo "::error::Unexpected nested release asset: $asset"
              exit 1
            fi
          done < <(find release-assets -type f -print0)

      - name: Create checksums for server binaries
        working-directory: release-assets
        run: |
          sha256sum server-linux-amd64/voice-server-linux-amd64 server-linux-arm64/voice-server-linux-arm64 |
            sed 's|  server-linux-[^/]*/|  |' > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_flags=()
            if [[ "$TAG" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes --draft "${release_flags[@]}"
          fi
          mapfile -d '' assets < <(find release-assets -type f -print0)
          (( ${#assets[@]} > 0 ))
          duplicates=$(printf '%s\n' "${assets[@]##*/}" | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate release asset names: $duplicates"
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
