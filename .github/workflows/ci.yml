name: Server CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun audit
      - run: bun run check
      - run: bunx --bun playwright install --with-deps chromium
      - name: Build and run unit and integration tests on the native architecture
        run: docker build --target checks .
      - name: Compile the native Docker image and standalone executable
        run: docker build -t voice-server:ci .
      - name: Run standalone without external network, credentials or installed language runtime
        run: bash scripts/docker-smoke.sh voice-server:ci
      - name: Authenticate and transfer Opus through the standalone and published ports
        env:
          VOICE_TEST_DOCKER_IMAGE: voice-server:ci
        run: bun run test:e2e
      - name: Collect release files
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p artifacts notice
          instance=$(docker create voice-server:ci)
          trap 'docker rm -v "$instance" >/dev/null' EXIT
          docker cp "$instance:/usr/local/bin/voice-server" "artifacts/voice-server-linux-$ARCH"
          docker cp "$instance:/usr/share/doc/voice-server/." notice
          tar -C notice -czf "artifacts/voice-server-linux-$ARCH-licenses.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: voice-server-linux-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error

  release:
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: voice-server-linux-*
          path: release
          merge-multiple: true
      - name: Generate checksums and create a draft release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum voice-server-linux-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes voice-server-linux-* SHA256SUMS
